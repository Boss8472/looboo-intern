<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entwurf 05 · Swiss Grid – looboo</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="../looboo/favicon.svg" type="image/svg+xml">
  <style>
    :root { --bg: #f2f0eb; --ink: #141414; --red: #e3241b; --muted: #6a6a6a; --line: #141414; }
    @media (prefers-color-scheme: dark) { :root { --bg: #141414; --ink: #f2f0eb; --muted: #9a9a9a; --line: #f2f0eb; } }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; min-height: 100svh;
      background: var(--bg); color: var(--ink);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    .grid {
      min-height: 100vh; min-height: 100svh;
      display: grid; grid-template-columns: repeat(12, 1fr); grid-template-rows: auto 1fr auto auto;
      column-gap: 16px; padding: 24px 16px;
    }
    .meta { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; font-size: 13px; line-height: 1.4; border-top: 2px solid var(--line); padding-top: 8px; }
    .meta b { display: block; }
    .square { grid-column: 9 / 13; grid-row: 2; align-self: start; margin-top: 48px; aspect-ratio: 1; background: var(--red); }
    h1 { grid-column: 1 / -1; grid-row: 3; margin: 0; font-size: clamp(72px, 20vw, 260px); font-weight: 700; letter-spacing: -.055em; line-height: .8; }
    p { grid-column: 1 / 7; grid-row: 4; margin: 28px 0 0; padding-top: 8px; border-top: 2px solid var(--line); font-size: clamp(18px, 2.2vw, 24px); font-weight: 500; }
    footer { grid-column: 7 / -1; grid-row: 4; margin-top: 28px; padding-top: 8px; border-top: 2px solid var(--line); font-size: 13px; color: var(--muted); text-align: right; }
    @media (max-width: 640px) {
      .meta { grid-template-columns: 1fr 1fr; }
      .meta div:last-child { display: none; }
      .square { grid-column: 7 / 13; }
      p, footer { grid-column: 1 / -1; }
      footer { grid-row: 5; text-align: left; }
    }
  </style>
</head>
<body>
  <div class="grid">
    <div class="meta">
      <div><b>looboo.de</b>Domain</div>
      <div><b>Im Aufbau</b>Status</div>
      <div><b>2026</b>Jahr</div>
    </div>
    <div class="square" aria-hidden="true"></div>
    <h1>looboo</h1>
    <p>Hier entsteht etwas Neues.</p>
    <footer>© 2026 looboo.de</footer>
  </div>
</body>
</html>
