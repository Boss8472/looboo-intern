<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entwurf 07 · Papier & Editorial – looboo</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="../looboo/favicon.svg" type="image/svg+xml">
  <style>
    :root { --bg: #f5efe3; --ink: #231f1a; --muted: #7a6f60; --rule: #cdbfa6; --accent: #9c3b22; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1e1b17; --ink: #efe6d6; --muted: #a8998a; --rule: #4a4238; --accent: #e08a6a; } }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; min-height: 100svh;
      display: grid; place-items: center;
      background: var(--bg); color: var(--ink);
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    }
    article { width: min(100% - 32px, 680px); padding: 48px 0; text-align: center; }
    .kicker { font-size: 13px; letter-spacing: .25em; text-transform: uppercase; color: var(--muted); border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 10px 0; display: flex; justify-content: space-between; gap: 16px; }
    h1 { margin: 40px 0 8px; font-size: clamp(64px, 15vw, 150px); font-weight: 400; font-style: italic; letter-spacing: -.02em; line-height: 1; }
    .orn { color: var(--accent); font-size: 22px; letter-spacing: .6em; margin: 16px 0 24px; }
    p { margin: 0 auto; max-width: 30ch; font-size: clamp(20px, 3vw, 28px); line-height: 1.4; }
    p::first-letter { color: var(--accent); }
    footer { margin-top: 48px; padding-top: 12px; border-top: 1px solid var(--rule); font-size: 14px; color: var(--muted); font-style: italic; }
  </style>
</head>
<body>
  <article>
    <div class="kicker"><span>Ausgabe Nr. 0</span><span>looboo.de</span><span>2026</span></div>
    <h1>looboo</h1>
    <div class="orn" aria-hidden="true">✦ ✦ ✦</div>
    <p>Hier entsteht etwas Neues.</p>
    <footer>© 2026 looboo.de · Fortsetzung folgt.</footer>
  </article>
</body>
</html>
